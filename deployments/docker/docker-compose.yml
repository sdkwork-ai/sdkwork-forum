x-database-environment: &database-environment
  SDKWORK_DATABASE_ENGINE: postgresql
  SDKWORK_DATABASE_HOST: postgres
  SDKWORK_DATABASE_PORT: "5432"
  SDKWORK_DATABASE_NAME: sdkwork_ai_dev
  SDKWORK_DATABASE_SCHEMA: sdkwork_ai_dev
  SDKWORK_DATABASE_SCHEMA_FALLBACK_PUBLIC: "false"
  SDKWORK_DATABASE_USERNAME: sdkwork_ai_dev
  SDKWORK_DATABASE_PASSWORD: sdkworkdev123
  SDKWORK_DATABASE_SSL_MODE: disable
  SDKWORK_DATABASE_MAX_CONNECTIONS: "10"

# Shared log rotation policy (OPERATIONS_SPEC.md §2.3): every service rotates
# at 10MB, keeping 3 files, so container logs cannot fill the host disk.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# sdkwork-drive and sdkwork-search are reached in-process on the shared
# PostgreSQL (MODULE_SPEC.md §4.2), so this process needs no sibling endpoint
# and no sibling sidecar container. The retired SDKWORK_FORUM_DRIVE_URL and
# SDKWORK_FORUM_SEARCH_URL entries, and the unused OpenSearch service, were
# deleted rather than kept "just in case" (§4.2.7).
services:
  forum-api:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.server
    ports:
      - "8080:8080"
    environment:
      <<: *database-environment
      RUST_LOG: info
    depends_on:
      - postgres
    logging: *default-logging

  forum-worker:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.worker
    environment:
      <<: *database-environment
      RUST_LOG: info
    depends_on:
      - postgres
    logging: *default-logging

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sdkwork_ai_dev
      POSTGRES_USER: sdkwork_ai_dev
      POSTGRES_PASSWORD: sdkworkdev123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/001-workspace-schema.sql:/docker-entrypoint-initdb.d/001-workspace-schema.sql:ro
    logging: *default-logging

volumes:
  postgres_data:
