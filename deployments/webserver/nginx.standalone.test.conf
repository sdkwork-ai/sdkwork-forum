# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/forum/webserver.pid;
error_log /var/log/sdkwork/forum/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:8080;
    }
    server {
        listen 80;
        server_name forum-test.sdkwork.com forum-test.birdcoder.com forum-test.dtupay.com forum-test.noaper.com forum-test.sdkwork.cn forum-test.birdcoder.cn forum-test.dtupay.cn forum-test.noaper.cn forum-test.skubc.com forum-test.skubc.cn forum-test.zowalk.com forum-test.zowalk.cn forum-test.offer86.com forum-test.offer86.cn forum-test.86offer.com forum-test.86offer.cn;
        include snippets/adaptive-web.named-locations.conf;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            include snippets/adaptive-web.dispatch.conf;
        }
    }
}
