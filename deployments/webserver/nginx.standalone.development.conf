# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/forum/webserver.pid;
error_log /var/log/sdkwork/forum/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:8080;
    }
    server {
        listen 80;
        server_name forum-dev.sdkwork.com forum-dev.birdcoder.com forum-dev.dtupay.com forum-dev.noaper.com forum-dev.sdkwork.cn forum-dev.birdcoder.cn forum-dev.dtupay.cn forum-dev.noaper.cn forum-dev.skubc.com forum-dev.skubc.cn forum-dev.zowalk.com forum-dev.zowalk.cn forum-dev.offer86.com forum-dev.offer86.cn forum-dev.86offer.com forum-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
